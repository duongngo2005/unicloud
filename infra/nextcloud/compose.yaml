
name: unicloud-storage

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/init_env.py first}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: nextcloud:35.0.1-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/init_env.py first}

      REDIS_HOST: redis

      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-ncadmin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?Run python3 scripts/init_env.py first}
      NEXTCLOUD_TRUSTED_DOMAINS: "127.0.0.1 localhost 127.0.0.1:18080 localhost:18080"

      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 2G
      APACHE_BODY_LIMIT: "2147483648"

    volumes:
      - nc_html:/var/www/html

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cron:
    image: nextcloud:35.0.1-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - nc_html:/var/www/html
    depends_on:
      app:
        condition: service_started

volumes:
  pg_data:
  nc_html:
